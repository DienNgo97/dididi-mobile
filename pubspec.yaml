name: dididi_mobile
description: "Dididi - đặt khách sạn & vé máy bay (mobile Android/iOS)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3+1
  go_router: ^14.2.0
  flutter_secure_storage: ^9.2.2
  intl: ">=0.19.0 <0.21.0"
  url_launcher: ^6.3.0
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  google_sign_in: ^6.2.1
  video_player: ^2.9.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
